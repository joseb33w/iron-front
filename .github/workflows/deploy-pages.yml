name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Supabase URL + anon (publishable) key are public by design — they get embedded
  # in any browser bundle. Real security comes from RLS policies in the database.
  VITE_SUPABASE_URL: https://xhhmxabftbyxrirvvihn.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_NZHoIxqqpSvVBP8MrLHCYA_gmg1AbN-
  VITE_TABLE_PREFIX: usr_nmexs7bytxq2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Mirror dist/ also into gh-pages branch (kept for history / source-of-truth)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy ${{ github.sha }}'

      # Pages serves main/root, so push the built artifacts there too.
      # Removes the old hashed assets, replaces index.html, and writes .nojekyll
      # so Jekyll doesn't strip the `assets/` underscore-prefixed files (if any).
      - name: Publish built dist to main root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -rf assets
          cp -r dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll
          git add -A index.html assets .nojekyll
          if git diff --staged --quiet; then
            echo "no built changes to publish"
          else
            git commit -m "deploy: built artifacts for ${{ github.sha }} [skip ci]"
            git push origin HEAD:main
          fi
