name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Supabase URL + anon (publishable) key are public by design — they get embedded
  # in any browser bundle. Real security comes from RLS policies in the database.
  VITE_SUPABASE_URL: https://xhhmxabftbyxrirvvihn.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_NZHoIxqqpSvVBP8MrLHCYA_gmg1AbN-
  VITE_TABLE_PREFIX: usr_nmexs7bytxq2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
