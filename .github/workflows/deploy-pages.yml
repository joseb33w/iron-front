name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Supabase URL + anon (publishable) key are public by design — they get embedded
  # in any browser bundle. Real security comes from RLS policies in the database.
  VITE_SUPABASE_URL: https://xhhmxabftbyxrirvvihn.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_NZHoIxqqpSvVBP8MrLHCYA_gmg1AbN-
  VITE_TABLE_PREFIX: usr_nmexs7bytxq2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Each deploy commits the BUILT index.html (hashed asset refs) to repo root for
      # GitHub Pages to serve. Before re-building, restore the SOURCE index.html so
      # Vite uses /src/main.jsx as the entry point — otherwise the next build would
      # try to bundle the previous build's hashed asset path and produce stale output.
      - name: Restore source index.html
        run: |
          cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="theme-color" content="#16110a" />
              <title>Iron Front — Dieselpunk Combat</title>
              <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2316110a'/%3E%3Ctext x='32' y='44' font-size='40' text-anchor='middle' fill='%23f5b85a'%3E⚙%3C/text%3E%3C/svg%3E" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.jsx"></script>
            </body>
          </html>
          HTML

      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Mirror dist/ to gh-pages branch (source-of-truth for the built artifacts)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy ${{ github.sha }}'

      # Pages serves main/root, so publish the built artifacts there too.
      # The next workflow run restores the source index.html in the step above.
      - name: Publish built dist to main root
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -rf assets
          cp -r dist/assets ./assets
          cp dist/index.html ./index.html
          touch .nojekyll
          git add -A index.html assets .nojekyll
          if git diff --staged --quiet; then
            echo "no built changes to publish"
          else
            git commit -m "deploy: built artifacts for ${{ github.sha }} [skip ci]"
            git push origin HEAD:main
          fi
