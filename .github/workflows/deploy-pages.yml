name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Supabase URL + anon (publishable) key are public by design — they get embedded
  # in any browser bundle. Real security comes from RLS policies in the database.
  VITE_SUPABASE_URL: https://xhhmxabftbyxrirvvihn.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_NZHoIxqqpSvVBP8MrLHCYA_gmg1AbN-
  VITE_TABLE_PREFIX: usr_nmexs7bytxq2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy ${{ github.sha }}'
      - name: Point Pages source at gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api -X PUT "/repos/${{ github.repository }}/pages" \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' && echo "Pages source updated" && exit 0
          # if PUT failed because Pages isn't enabled yet, try POST instead
          gh api -X POST "/repos/${{ github.repository }}/pages" \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' && echo "Pages enabled" || echo "Pages config unchanged (already pointing at gh-pages or other error)"
